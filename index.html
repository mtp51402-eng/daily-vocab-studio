<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV-Daily Vocab Studio — Next-Gen 20-Day English App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #050811;
      --bg-elevated: rgba(15, 23, 42, 0.72);
      --bg-card: rgba(23, 35, 58, 0.78);
      --bg-card-hover: rgba(30, 46, 76, 0.92);
      --border-subtle: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(56, 189, 248, 0.35);
      --cyan: #38bdf8;
      --indigo: #818cf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --shadow-lg: 0 24px 60px -15px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Malayalam', sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(at 12% 10%, rgba(56, 189, 248, 0.16) 0px, transparent 50%),
        radial-gradient(at 88% 15%, rgba(129, 140, 248, 0.16) 0px, transparent 50%),
        radial-gradient(at 50% 95%, rgba(52, 211, 153, 0.10) 0px, transparent 55%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 14px 40px;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel {
      background: var(--bg-elevated);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 22px;
      box-shadow: var(--shadow-lg);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 16px 22px;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--cyan), var(--indigo));
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.28);
    }

    .brand-name {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .nav-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip-cyan {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
    }

    .chip-emerald {
      background: rgba(52, 211, 153, 0.12);
      border-color: rgba(52, 211, 153, 0.3);
      color: #6ee7b7;
    }

    .btn {
      border: none;
      border-radius: var(--radius-md);
      padding: 12px 20px;
      font-family: inherit;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.14s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0) scale(0.98); }

    .btn-primary {
      background: linear-gradient(135deg, var(--cyan), #0284c7);
      color: #041322;
      box-shadow: 0 10px 24px -6px rgba(56, 189, 248, 0.45);
    }

    .btn-success {
      background: linear-gradient(135deg, var(--emerald), #059669);
      color: #03261b;
      box-shadow: 0 10px 24px -6px rgba(52, 211, 153, 0.4);
    }

    .btn-outline {
      background: rgba(30, 41, 59, 0.55);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    .btn-outline:hover {
      border-color: var(--border-strong);
      background: rgba(30, 41, 59, 0.9);
    }

    .btn-sm {
      padding: 8px 13px;
      font-size: 0.84rem;
      border-radius: 11px;
    }

    .hero-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .day-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .day-heading {
      margin: 4px 0 0;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .word-bento {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .word-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.16s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .word-tile:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.35);
      background: var(--bg-card-hover);
    }

    .word-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-index {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .speak-mini {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--cyan);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    .speak-mini:hover { background: rgba(56, 189, 248, 0.24); }

    .tile-en {
      font-size: 1.28rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .tile-ml {
      font-size: 1.04rem;
      font-weight: 700;
      color: var(--cyan);
    }

    .tile-ex {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      margin-top: 2px;
    }

    .stepper {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .step-track {
      height: 7px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      overflow: hidden;
    }

    .step-track.done { background: var(--emerald); }
    .step-track.active {
      background: linear-gradient(90deg, var(--cyan), var(--indigo));
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }

    .stage-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .stage-title {
      font-weight: 800;
      font-size: 1.02rem;
      color: var(--text-primary);
    }

    .stage-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 26px 18px;
      text-align: center;
    }

    .target-word {
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin: 10px 0 6px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    @media (max-width: 560px) {
      .options-grid { grid-template-columns: 1fr; }
      .target-word { font-size: 1.75rem; }
    }

    .choice-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 16px 14px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 1.06rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .choice-btn:hover {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.12);
      transform: translateY(-1px);
    }

    .choice-btn.right {
      background: rgba(52, 211, 153, 0.2);
      border-color: var(--emerald);
      color: #a7f3d0;
    }

    .choice-btn.wrong {
      background: rgba(251, 113, 133, 0.2);
      border-color: var(--rose);
      color: #fecdd3;
    }

    .input-field, .textarea-field {
      width: 100%;
      margin-top: 14px;
      background: rgba(9, 14, 26, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: #ffffff;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-size: 1.1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus, .textarea-field:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .alert-box {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
    }

    .alert-box.good {
      display: block;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #6ee7b7;
    }

    .alert-box.bad {
      display: block;
      background: rgba(251, 113, 133, 0.15);
      border: 1px solid rgba(251, 113, 133, 0.4);
      color: #fda4af;
    }

    .curriculum-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .day-node {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-node:hover {
      border-color: var(--cyan);
      transform: translateY(-2px);
    }

    .day-node.done {
      border-color: rgba(52, 211, 153, 0.45);
      background: rgba(52, 211, 153, 0.1);
    }

    .day-node.now {
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.14);
    }

    .cert-frame {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.96), rgba(24, 35, 58, 0.96));
      border: 2px solid rgba(251, 191, 36, 0.65);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .cert-badge {
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      color: var(--amber);
      text-transform: uppercase;
    }

    .cert-heading {
      font-size: 1.75rem;
      font-weight: 800;
      color: #fde68a;
      margin: 8px 0;
    }

    .cert-recipient {
      display: inline-block;
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      padding: 6px 26px;
      margin: 12px 0;
      border-bottom: 2px dashed rgba(251, 191, 36, 0.55);
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    @media (max-width: 520px) {
      .metrics-row { grid-template-columns: 1fr; }
    }

    .metric-box {
      background: rgba(9, 14, 26, 0.65);
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-radius: var(--radius-md);
      padding: 14px 10px;
    }

    .metric-num {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--cyan);
    }

    .metric-label {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    @media print {
      body { background: #fff; color: #0f172a; padding: 0; }
      .no-print { display: none !important; }
      .panel { border: none; box-shadow: none; background: transparent; padding: 0; }
      .cert-frame { background: #fffbeb; border: 3px solid #b45309; color: #0f172a; box-shadow: none; }
      .cert-heading { color: #92400e; }
      .cert-recipient { color: #0f172a; border-bottom-color: #b45309; }
      .metric-box { background: #fef3c7; border-color: #d97706; }
      .metric-num { color: #0369a1; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="panel header no-print">
      <div class="brand-wrap">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-name">CV-Daily Vocab Studio</div>
          <div class="brand-sub">20-Day Smart Everyday English</div>
        </div>
      </div>

      <div class="nav-group">
        <span class="chip chip-cyan" id="headerDay">ദിവസം 1 / 20</span>
        <span class="chip chip-emerald" id="headerScore">0 / 200 വാക്കുകൾ</span>
        <button class="btn btn-outline btn-sm" onclick="openCurriculum()">സിലബസ്</button>
        <button class="btn btn-outline btn-sm" onclick="openCertificate()">സർട്ടിഫിക്കറ്റ്</button>
      </div>
    </header>

    <main id="appViewport" class="panel"></main>
  </div>

  <script>
    const CURRICULUM = [
      { title: "ദിവസം 1: വീടും അടിസ്ഥാന കാര്യങ്ങളും", words: [
        { en: "house", ml: "വീട്", alt: ["ഭവന", "ഇല്ലം", "വീട"], ex: "This is my house." },
        { en: "door", ml: "വാതിൽ", alt: ["കവാടം", "വാതില"], ex: "Please open the door." },
        { en: "window", ml: "ജനൽ", alt: ["ജനാല", "കിളിവാതിൽ"], ex: "Close the window." },
        { en: "room", ml: "മുറി", alt: ["അറ", "റൂം"], ex: "My room is clean." },
        { en: "water", ml: "വെള്ളം", alt: ["ജലം", "വെള്ള"], ex: "Drink clean water." },
        { en: "food", ml: "ഭക്ഷണം", alt: ["ആഹാരം", "ഊണ്", "ഭക്ഷണ"], ex: "The food is ready." },
        { en: "rice", ml: "ചോറ് / അരി", alt: ["ചോറ", "അരി", "നെല്ല്"], ex: "We eat rice every day." },
        { en: "milk", ml: "പാൽ", alt: ["പാല", "ക്ഷീരം"], ex: "I drink warm milk." },
        { en: "bread", ml: "റൊട്ടി / ബ്രഡ്", alt: ["റൊട്ടി", "ബ്രഡ്", "അപ്പം"], ex: "She eats bread." },
        { en: "salt", ml: "ഉപ്പ്", alt: ["ഉപ്പ", "ലവണം"], ex: "Add a little salt." }
      ]},
      { title: "ദിവസം 2: അടുക്കളയും പാനീയങ്ങളും", words: [
        { en: "sugar", ml: "പഞ്ചസാര", alt: ["മധുരം", "പഞ്ചാര"], ex: "Do you want sugar?" },
        { en: "tea", ml: "ചായ", alt: ["തേയില"], ex: "Let us drink tea." },
        { en: "coffee", ml: "കാപ്പി", alt: ["കോഫി"], ex: "He likes hot coffee." },
        { en: "plate", ml: "പ്ലേറ്റ് / പാത്രം", alt: ["പ്ലേറ്റ്", "പാത്രം", "തളിക"], ex: "Put it on the plate." },
        { en: "cup", ml: "കപ്പ്", alt: ["കപ്പ", "കോപ്പ"], ex: "A cup of tea, please." },
        { en: "spoon", ml: "സ്പൂൺ", alt: ["സ്പൂണ"], ex: "Give me a spoon." },
        { en: "knife", ml: "കത്തി", alt: ["പിച്ചാത്തി"], ex: "Be careful with the knife." },
        { en: "bottle", ml: "കുപ്പി", alt: ["ബോട്ടിൽ"], ex: "Fill the water bottle." },
        { en: "kitchen", ml: "അടുക്കള", alt: ["പാചകപ്പുര"], ex: "Mother is in the kitchen." },
        { en: "breakfast", ml: "പ്രഭാതഭക്ഷണം", alt: ["രാവിലത്തെ ഭക്ഷണം", "പ്രാതൽ"], ex: "Have your breakfast." }
      ]},
      { title: "ദിവസം 3: വീട്ടിലെ സാധനങ്ങൾ", words: [
        { en: "chair", ml: "കസേര", alt: ["ഇരിപ്പിടം"], ex: "Sit on the chair." },
        { en: "table", ml: "മേശ", alt: ["ടേബിൾ"], ex: "The book is on the table." },
        { en: "bed", ml: "കട്ടിൽ / കിടക്ക", alt: ["കട്ടിൽ", "കിടക്ക", "ബെഡ്"], ex: "Go to bed early." },
        { en: "pillow", ml: "തലയിണ", alt: ["തലയണ"], ex: "This pillow is soft." },
        { en: "blanket", ml: "പുതപ്പ്", alt: ["കമ്പിളി", "പുതപ്പ"], ex: "Take a warm blanket." },
        { en: "lamp", ml: "വിളക്ക്", alt: ["ദീപം", "ലൈറ്റ്", "വിളക്ക"], ex: "Turn on the lamp." },
        { en: "clock", ml: "ക്ലോക്ക്", alt: ["ഘടികാരം", "വാച്ച്"], ex: "Look at the clock." },
        { en: "mirror", ml: "കണ്ണാടി", alt: ["ദർപ്പണം"], ex: "She looked in the mirror." },
        { en: "key", ml: "താക്കോൽ", alt: ["ചാവി", "താക്കോല"], ex: "Where is the house key?" },
        { en: "lock", ml: "പൂട്ട്", alt: ["താഴ്", "പൂട്ട"], ex: "Check the door lock." }
      ]},
      { title: "ദിവസം 4: വൃത്തിയും നിത്യോപയോഗ സാധനങ്ങളും", words: [
        { en: "bag", ml: "ബാഗ്", alt: ["സഞ്ചി", "ബാഗ"], ex: "Carry your bag." },
        { en: "towel", ml: "തോർത്ത് / ടവൽ", alt: ["തോർത്ത്", "ടവൽ", "തുവർത്ത്"], ex: "Use a clean towel." },
        { en: "soap", ml: "സോപ്പ്", alt: ["സോപ്പ"], ex: "Wash hands with soap." },
        { en: "brush", ml: "ബ്രഷ്", alt: ["ബ്രഷ"], ex: "Brush your teeth daily." },
        { en: "broom", ml: "ചൂൽ", alt: ["ചൂല", "അടിച്ചുവാരി"], ex: "Sweep with a broom." },
        { en: "bucket", ml: "ബക്കറ്റ്", alt: ["തൊട്ടി"], ex: "The bucket is full." },
        { en: "wall", ml: "ചുമർ", alt: ["ഭിത്തി", "മതിൽ"], ex: "Paint the wall white." },
        { en: "floor", ml: "തറ", alt: ["നിലം"], ex: "Clean the floor." },
        { en: "roof", ml: "മേൽക്കൂര", alt: ["കൂര"], ex: "The roof is strong." },
        { en: "garden", ml: "പൂന്തോട്ടം", alt: ["തോട്ടം"], ex: "Flowers grow in the garden." }
      ]},

    const STORE_KEY = "dvs_pro_20d_v4";
    let state = JSON.parse(localStorage.getItem(STORE_KEY) || "null") || {
      currentDay: 0,
      completedDays: [],
      learnerName: "പഠിതാവ് (Learner)",
      totalAnswered: 0,
      totalCorrect: 0
    };

    function persist() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      syncHeader();
    }

    function syncHeader() {
      const mastered = state.completedDays.length * 10;
      document.getElementById("headerDay").textContent = `ദിവസം ${state.currentDay + 1} / 20`;
      document.getElementById("headerScore").textContent = `${mastered} / 200 വാക്കുകൾ`;
    }

    function speakWord(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = 0.92;
      window.speechSynthesis.speak(utter);
    }

    // ദിവസം 20-ൽ (അവസാനത്തെ 200-ാം വാക്കിന്റെ ഘട്ടത്തിൽ) മാത്രമേ Sentence Building (ഘട്ടം 5) ഉള്ളൂ
    function getMaxStagesForDay(dayIdx) {
      return dayIdx === 19 ? 5 : 4;
    }

    let session = {
      stage: 0,
      queue: [],
      idx: 0,
      streak: 0,
      maxStreak1: 0,
      mastered1: new Set(),
      locked: false
    };

    function buildDayQueue(dayIdx) {
      const primary = CURRICULUM[dayIdx].words.map(w => ({ ...w, isReview: false }));
      if (dayIdx > 0) {
        const pool = [];
        for (let d = 0; d < dayIdx; d++) {
          CURRICULUM[d].words.forEach(w => pool.push({ ...w, isReview: true }));
        }
        pool.sort(() => Math.random() - 0.5);
        return [...primary, ...pool.slice(0, 2)];
      }
      return primary;
    }

    function startDay(dayIdx) {
      state.currentDay = dayIdx;
      persist();
      session.stage = 0;
      renderView();
    }

    function launchStage(stageNum) {
      session.stage = stageNum;
      session.queue = buildDayQueue(state.currentDay).sort(() => Math.random() - 0.5);
      session.idx = 0;
      session.streak = 0;
      session.maxStreak1 = 0;
      session.mastered1 = new Set();
      session.locked = false;
      renderView();
    }

    function allWordsPool() {
      return CURRICULUM.flatMap(d => d.words);
    }

    function normalizeMalayalam(str) {
      return (str || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/[.,!?'"()]/g, "")
        .replace(/ിക$/g, "ുക")
        .replace(/വുക$/g, "കുക")
        .replace(/്$/g, "");
    }

    function matchesMalayalamMeaning(input, wordObj) {
      const raw = (input || "").trim();
      if (!raw) return false;
      const uNorm = normalizeMalayalam(raw);
      const variants = [...wordObj.ml.split("/").map(s => s.trim()), ...(wordObj.alt || [])];

      return variants.some(v => {
        const vNorm = normalizeMalayalam(v);
        if (!vNorm) return false;
        if (uNorm === vNorm || raw === v) return true;
        if (uNorm.length >= 2 && (vNorm.includes(uNorm) || uNorm.includes(vNorm))) return true;
        const minLen = Math.min(uNorm.length, vNorm.length);
        if (minLen >= 3 && uNorm.slice(0, 3) === vNorm.slice(0, 3)) return true;
        return false;
      });
    }

    function renderView() {

      const box = document.getElementById("appViewport");
      const dayData = CURRICULUM[state.currentDay];

          </div>

        return;
      }

      const stageList = Array.from({ length: maxStages }, (_, idx) => idx + 1);
      const progressBar = stageList
        .map(s => `<div class="step-track ${s < session.stage ? "done" : (s === session.stage ? "active" : "")}"></div>`)
        .join("");

      const activeWord = session.queue[session.idx];
      const stageLabel = {
        1: "ഘട്ടം 1 • ഇംഗ്ലീഷ് → മലയാളം തിരഞ്ഞെടുക്കൽ (4 Streak നിർബന്ധം)",
        2: "ഘട്ടം 2 • മലയാളം → ഇംഗ്ലീഷ് തിരഞ്ഞെടുക്കൽ",
        3: "ഘട്ടം 3 • മലയാളം അർത്ഥം ടൈപ്പ് ചെയ്യുക",

      const statusChip = session.stage === 1
        ? `<span class="chip chip-cyan">Streak: ${session.streak} / 4 • Mastered: ${session.mastered1.size} / ${session.queue.length}</span>`

      let stageBody = "";

      if (session.stage === 1 || session.stage === 2) {
        const isEnToMl = session.stage === 1;
        const prompt = isEnToMl ? activeWord.en : activeWord.ml;
        const answer = isEnToMl ? activeWord.ml : activeWord.en;

        const pool = allWordsPool()
          .map(w => isEnToMl ? w.ml : w.en)
          .filter(v => v !== answer)
          .sort(() => Math.random() - 0.5);

        const choices = [answer, ...new Set(pool)].slice(0, 4).sort(() => Math.random() - 0.5);

        stageBody = `
          <div class="stage-card">
            ${activeWord.isReview ? '<span class="chip" style="border-color:rgba(251,191,36,0.45); color:#fde68a;">🔄 മുൻ ദിവസത്തെ റിവിഷൻ</span>' : ''}
            <div class="target-word">${prompt}</div>
            ${isEnToMl ? `<button class="speak-mini" style="margin-top:4px;" onclick="speakWord('${activeWord.en.replace(/'/g, "\\'")}')">🔊 ഉച്ചാരണം കേൾക്കുക</button>` : ''}
            <div style="color:var(--text-secondary); font-size:0.88rem; margin-top:8px;">ശരിയായ ഉത്തരം തിരഞ്ഞെടുക്കുക</div>
          </div>
          <div class="options-grid">
            ${choices.map(opt => `
              <button class="choice-btn" onclick="onSelectChoice(this, '${opt.replace(/'/g, "\\'")}', '${answer.replace(/'/g, "\\'")}')">${opt}</button>
            `).join("")}
          </div>
          <div id="stageFeedback" class="alert-box"></div>
        `;
      } else if (session.stage === 3 || session.stage === 4) {
        const isMl = session.stage === 3;
        const prompt = isMl ? activeWord.en : activeWord.ml;
        const hint = isMl ? "ഏകദേശ മലയാളം അർത്ഥം ടൈപ്പ് ചെയ്യുക (ഉദാ: വരിക / വരുക)..." : "Type the English word...";

        stageBody = `
          <div class="stage-card">
            ${activeWord.isReview ? '<span class="chip" style="border-color:rgba(251,191,36,0.45); color:#fde68a;">🔄 റിവിഷൻ വാക്ക്</span>' : ''}
            <div class="target-word">${prompt}</div>
            ${isMl ? `<button class="speak-mini" onclick="speakWord('${activeWord.en.replace(/'/g, "\\'")}')">🔊 Listen</button>` : ''}

          <input type="text" id="typedInput" class="input-field" placeholder="${hint}" onkeydown="if(event.key==='Enter') onSubmitTyped()" autofocus />

          </div>
          <div id="stageFeedback" class="alert-box"></div>
        `;
      } else if (session.stage === 5) {
        stageBody = `
          <div class="stage-card">
            <div style="color:var(--text-secondary); font-size:0.9rem;">ഈ വാക്ക് ഉൾപ്പെടുത്തി ഏതെങ്കിലും ഒരു ചെറിയ വാചകം എഴുതുക:</div>

            <button class="speak-mini" onclick="speakWord('${activeWord.ex.replace(/'/g, "\\'")}')">🔊 ഉദാഹരണം കേൾക്കുക</button>
            <div style="color:var(--text-secondary); font-size:0.84rem; margin-top:8px;">ഉദാഹരണം: <i>${activeWord.ex}</i></div>
          </div>
          <textarea id="sentenceInput" rows="2" class="textarea-field" placeholder="Write any simple sentence using '${activeWord.en}'..."></textarea>
          <div style="margin-top:12px;">
            <button class="btn btn-success" onclick="onSubmitSentence()">വാചകം സമർപ്പിക്കുക</button>
          </div>
          <div id="stageFeedback" class="alert-box"></div>
        `;
      }

      box.innerHTML = `
        <div class="stepper" style="grid-template-columns: repeat(${maxStages}, 1fr);">${progressBar}</div>
        <div class="stage-meta">
          <div class="stage-title">${stageLabel[session.stage]}</div>
          ${statusChip}
        </div>
        ${stageBody}
      `;

    function onSelectChoice(btn, picked, rightAns) {
      if (session.locked) return;
      session.locked = true;
      state.totalAnswered++;
      const fb = document.getElementById("stageFeedback");
      const current = session.queue[session.idx];

      if (picked === rightAns) {
        state.totalCorrect++;
        btn.classList.add("right");
        session.streak++;
        if (session.stage === 1) {
          session.mastered1.add(current.en);
          if (session.streak >= 4) session.maxStreak1 = Math.max(session.maxStreak1, session.streak);
        }
        fb.className = "alert-box good";
        fb.textContent = "ശരിയാണ്! മികച്ച മുന്നേറ്റം.";
        persist();

        setTimeout(() => {
          if (session.stage === 1) {
            const masteredAll = session.mastered1.size >= session.queue.length;
            const streakOk = session.maxStreak1 >= 4 || session.streak >= 4;
            if (masteredAll && streakOk) {
              launchStage(2);
              return;
            }
            const remaining = session.queue.filter(w => !session.mastered1.has(w.en));
            session.idx = remaining.length > 0
              ? session.queue.indexOf(remaining[0])
              : Math.floor(Math.random() * session.queue.length);
            session.locked = false;
            renderView();
          } else {
            if (session.idx + 1 < session.queue.length) {
              session.idx++;
              session.locked = false;
              renderView();
            } else {
              launchStage(3);
            }
          }
        }, 650);
      } else {
        btn.classList.add("wrong");
        session.streak = 0;
        fb.className = "alert-box bad";
        fb.textContent = `ശരിയായ ഉത്തരം: ${rightAns}`;
        persist();

        setTimeout(() => {
          const item = session.queue.splice(session.idx, 1)[0];
          session.queue.push(item);
          if (session.stage === 1) session.idx = 0;
          session.locked = false;
          renderView();
        }, 1100);
      }
    }

    function onSubmitTyped() {
      if (session.locked) return;
      const raw = (document.getElementById("typedInput").value || "").trim();
      if (!raw) return;
      const current = session.queue[session.idx];
      const fb = document.getElementById("stageFeedback");
      state.totalAnswered++;

      const valid = session.stage === 3
        ? matchesMalayalamMeaning(raw, current)
        : raw.toLowerCase() === current.en.toLowerCase();

      const displayAns = session.stage === 3 ? current.ml : current.en;
      session.locked = true;

      if (valid) {
        state.totalCorrect++;
        fb.className = "alert-box good";
        fb.textContent = `ശരിയാണ്! (${displayAns})`;
        persist();
        setTimeout(() => {
          if (session.idx + 1 < session.queue.length) {
            session.idx++;
            session.locked = false;
            renderView();
          } else {
            const maxStages = getMaxStagesForDay(state.currentDay);
            if (session.stage < maxStages) {
              launchStage(session.stage + 1);
            } else {
              finishDay();
            }
          }
        }, 700);
      } else {
        fb.className = "alert-box bad";
        fb.textContent = `അർത്ഥം: ${displayAns} — വീണ്ടും ശ്രമിക്കാം.`;
        persist();
        setTimeout(() => {
          const item = session.queue.splice(session.idx, 1)[0];
          session.queue.push(item);
          session.locked = false;
          renderView();
        }, 1150);
      }
    }

    function onSubmitSentence() {
      if (session.locked) return;
      const sent = (document.getElementById("sentenceInput").value || "").trim();
      const current = session.queue[session.idx];
      const fb = document.getElementById("stageFeedback");

      const lower = sent.toLowerCase();
      const target = current.en.toLowerCase();
      const stem = target.length >= 4 ? target.slice(0, target.length - 1) : target;
      const containsWord = lower.includes(target) || (stem.length >= 3 && lower.includes(stem));

      if (!containsWord || sent.length < target.length + 2) {
        fb.className = "alert-box bad";
        fb.textContent = `'${current.en}' എന്ന വാക്ക് ഉൾപ്പെടുത്തി ഏതെങ്കിലും ഒരു ചെറിയ വാചകം എഴുതുക.`;
        return;
      }

      session.locked = true;
      state.totalAnswered++;
      state.totalCorrect++;
      fb.className = "alert-box good";
      fb.textContent = "അടിപൊളി! വാചകം സ്വീകരിച്ചു.";
      persist();

      setTimeout(() => {
        if (session.idx + 1 < session.queue.length) {
          session.idx++;
          session.locked = false;
          renderView();
        } else {
          finishDay();
        }
      }, 700);
    }

    function finishDay() {
      if (!state.completedDays.includes(state.currentDay)) {
        state.completedDays.push(state.currentDay);
      }
      const upcoming = state.currentDay + 1 < 20 ? state.currentDay + 1 : 19;
      state.currentDay = upcoming;
      persist();

      const box = document.getElementById("appViewport");
      const finishedAll = state.completedDays.length >= 20;

      box.innerHTML = `
        <div style="text-align:center; padding:24px 10px;">
          <div style="font-size:3.2rem;">🌟</div>
          <h2 style="margin:10px 0 6px; font-size:1.55rem;">ദിവസത്തെ പരിശീലനം പൂർത്തിയായി!</h2>
          <p style="color:var(--text-secondary);">പഠിച്ച ആകെ വാക്കുകൾ: <strong style="color:var(--emerald);">${state.completedDays.length * 10} / 200</strong></p>
          <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:20px;">
            ${finishedAll
              ? `<button class="btn btn-success" onclick="openCertificate()">🏆 Mastery സർട്ടിഫിക്കറ്റ് കാണുക</button>`
              : `<button class="btn btn-primary" onclick="startDay(${upcoming})">അടുത്ത ദിവസം (ദിവസം ${upcoming + 1}) →</button>`
            }
            <button class="btn btn-outline" onclick="openCurriculum()">20 ദിവസത്തെ സിലബസ്</button>
          </div>
        </div>
      `;
    }

    function openCurriculum() {
      syncHeader();
      const box = document.getElementById("appViewport");
      box.innerHTML = `
        <div class="hero-bar">
          <div>
            <div class="day-kicker">20-DAY ROADMAP • 200 WORDS</div>
            <h2 class="day-heading">ദൈനംദിന ഇംഗ്ലീഷ് പഠനപദ്ധതി</h2>
          </div>
          <span class="chip chip-emerald">${state.completedDays.length} / 20 പൂർത്തിയായി</span>
        </div>
        <div class="curriculum-grid">
          ${CURRICULUM.map((d, i) => {
            const isDone = state.completedDays.includes(i);
            const isNow = state.currentDay === i;
            return `
              <div class="day-node ${isDone ? "done" : ""} ${isNow ? "now" : ""}" onclick="startDay(${i})">
                <div style="font-weight:800; font-size:0.95rem;">ദിവസം ${i + 1}</div>
                <div style="font-size:0.76rem; color:var(--text-secondary); margin-top:4px;">
                  ${isDone ? "✅ Completed" : "10 Words"}
                </div>
              </div>
            `;
          }).join("")}
        </div>
        <div style="margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="startDay(${state.currentDay})">ദിവസം ${state.currentDay + 1} തുടരുക</button>
          <button class="btn btn-outline" onclick="openCertificate()">സർട്ടിഫിക്കറ്റ് കാണുക</button>
        </div>
      `;
    }

    function openCertificate() {
      syncHeader();
      const box = document.getElementById("appViewport");
      const doneCount = state.completedDays.length;
      const wordsCount = doneCount * 10;
      const accuracy = state.totalAnswered > 0 ? Math.round((state.totalCorrect / state.totalAnswered) * 100) : 100;
      const certId = `DVS-PRO-${String(wordsCount).padStart(3, "0")}-${new Date().getFullYear()}`;
      const unlocked = doneCount >= 20;

      box.innerHTML = `
        <div class="no-print" style="margin-bottom:16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
          <input type="text" id="nameField" class="input-field" value="${state.learnerName}" placeholder="പേര് നൽകുക..." style="margin-top:0; max-width:320px;" oninput="changeLearnerName(this.value)" />
          <button class="btn btn-success" onclick="window.print()">🖨️ പ്രിന്റ് / PDF സേവ്</button>
          <button class="btn btn-outline" onclick="startDay(${state.currentDay})">പഠനത്തിലേക്ക്</button>
        </div>
        <div class="cert-frame">
          <div style="font-size:2.5rem;">🏅</div>
          <div class="cert-badge">CERTIFICATE OF MASTERY</div>
          <div class="cert-heading">20-Day Everyday English Vocabulary</div>
          <p style="color:var(--text-secondary); margin:6px 0;">ഈ സർട്ടിഫിക്കറ്റ് അഭിമാനപൂർവ്വം സമർപ്പിക്കുന്നത്</p>
          <div class="cert-recipient" id="certNameText">${state.learnerName}</div>
          <p style="max-width:540px; margin:10px auto; line-height:1.65; font-size:0.96rem;">
            നിത്യജീവിതത്തിൽ ഉപയോഗിക്കുന്ന <strong>200 ഇംഗ്ലീഷ് വാക്കുകളുടെ</strong> പഠനപദ്ധതി വിജയകരമായി പരിശീലിച്ചതിന്.
          </p>
          <div class="metrics-row">
            <div class="metric-box">
              <div class="metric-num">${wordsCount} / 200</div>
              <div class="metric-label">പഠിച്ച വാക്കുകൾ</div>
            </div>
            <div class="metric-box">
              <div class="metric-num">${doneCount} / 20</div>
              <div class="metric-label">പൂർത്തിയായ ദിവസങ്ങൾ</div>
            </div>
            <div class="metric-box">
              <div class="metric-num">${accuracy}%</div>
              <div class="metric-label">കൃത്യത (Accuracy)</div>
            </div>
          </div>
          <div style="font-size:0.8rem; color:var(--text-secondary);">
            ID: <strong>${certId}</strong> • ${unlocked ? "✅ COMPLETED (200 Words Mastered)" : `പുരോഗതിയിൽ (${20 - doneCount} ദിവസം ബാക്കി)`}
          </div>
        </div>
      `;
    }

    function changeLearnerName(val) {
      state.learnerName = val || "പഠിതാവ് (Learner)";
      persist();
      const el = document.getElementById("certNameText");
      if (el) el.textContent = state.learnerName;
    }

    startDay(state.currentDay);
  </script>
</body>
</html>
